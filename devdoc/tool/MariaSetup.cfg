\* TLC configuration for MariaSetup.
\*
\* Two subjects is enough: one is the agent's, the other exercises the
\* unregistered-subject path.

SPECIFICATION Spec

CONSTANTS
    Subjects   = {s1, s2}
    NoSubject  = none
    NoVerifier = ""

INVARIANT TypeOK

\* EXPECTED TO BE VIOLATED — the violation is the deliverable.
\*
\* TLC refutes this in three steps (SetVerifier, MintKey, RegisterPrincipal):
\* a state where the disk is fully correct and the agent still cannot
\* authenticate, because Reload has not run. That trace is the outage, and
\* keeping the check here reproduces it on every run instead of trusting a
\* comment. If TLC ever reports this invariant as HOLDING, the spec has drifted
\* from the system it describes.
INVARIANT DiskCorrectImpliesAuth
